<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>汽车模型预览</title>

    <script type="module"
            src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #e6e6e6;
            font-family: Arial, sans-serif;
        }

        .panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 999;
            background: rgba(255,255,255,0.95);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            max-width: 460px;
            box-shadow: 0 2px 10px rgba(0,0,0,.15);
        }

        model-viewer {
            width: 100vw;
            height: 100vh;
            background: #dcdcdc;
        }

        .ok {
            color: green;
        }

        .err {
            color: red;
        }

        .warn {
            color: #cc8800;
        }
    </style>
</head>
<body>

    <model-viewer id="viewer"
                  src="/Assets/Models/sofa.glb"
                  alt="汽车模型"
                  camera-controls
                  auto-rotate
                  shadow-intensity="1"
                  environment-image="neutral"
                  exposure="1.2"
                  camera-target="0m 0m 0m"
                  camera-orbit="0deg 75deg 8m"
                  field-of-view="30deg"
                  interaction-prompt="none">
    </model-viewer>

    <script>
        const status = document.getElementById('status');
        const viewer = document.getElementById('viewer');

        function add(msg, cls = '') {
            const div = document.createElement('div');
            div.textContent = msg;
            if (cls) div.className = cls;
            status.appendChild(div);
