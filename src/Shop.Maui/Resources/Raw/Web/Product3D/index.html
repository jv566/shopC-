<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 模型展示</title>
    <script type="module"
            src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* 顶部信息栏 */
        .info-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 12px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-panel h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .info-panel .status {
            font-size: 12px;
            color: #4CAF50;
        }

        .info-panel .status.loading {
            color: #FFC107;
        }

        .info-panel .status.error {
            color: #f44336;
        }

        /* 底部控制栏 */
        .controls {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 28px;
        }

        .control-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn.active {
            background: #4CAF50;
        }

        /* 加载动画 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 16px;
            color: white;
            font-size: 14px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 提示信息 */
        .hint {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- 加载遮罩 -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div class="loading-text">正在加载 3D 模型...</div>
        </div>

        <!-- 信息栏 -->
        <div class="info-panel">
            <h1>3D 沙发预览</h1>
            <span class="status loading" id="statusText">加载中...</span>
        </div>

        <!-- 3D 模型查看器 -->
        <model-viewer id="viewer"
                      src="sofa.glb"
                      alt="3D 沙发模型"
                      camera-controls
                      auto-rotate
                      shadow-intensity="1"
                      environment-image="neutral"
                      exposure="1.2"
                      camera-target="0m 0.5m 0m"
                      camera-orbit="0deg 75deg 3m"
                      field-of-view="45deg"
                      interaction-prompt="none"
                      touch-action="pan-y">
        </model-viewer>

        <!-- 操作提示 -->
        <div class="hint">单指旋转 · 双指缩放 · 双击重置</div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button class="control-btn active" id="btnRotate" title="自动旋转">
                &#x21bb;
            </button>
            <button class="control-btn" id="btnReset" title="重置视角">
                &#x27f2;
            </button>
            <button class="control-btn" id="btnWireframe" title="线框模式">
                &#x25a6;
            </button>
        </div>
    </div>

    <script>
        const viewer = document.getElementById('viewer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const statusText = document.getElementById('statusText');
        const btnRotate = document.getElementById('btnRotate');
        const btnReset = document.getElementById('btnReset');
        const btnWireframe = document.getElementById('btnWireframe');

        let isAutoRotating = true;
        let isWireframe = false;

        // 模型加载成功
        viewer.addEventListener('load', () => {
            loadingOverlay.classList.add('hidden');
            statusText.textContent = '加载完成';
            statusText.classList.remove('loading');
            statusText.classList.remove('error');
            console.log('3D 模型加载成功');
        });

        // 模型加载失败
        viewer.addEventListener('error', (e) => {
            loadingOverlay.classList.add('hidden');
            statusText.textContent = '加载失败';
            statusText.classList.remove('loading');
            statusText.classList.add('error');
            console.error('3D 模型加载失败:', e);
        });

        // 自动旋转切换
        btnRotate.addEventListener('click', () => {
            isAutoRotating = !isAutoRotating;
            viewer.autoRotate = isAutoRotating;
            btnRotate.classList.toggle('active', isAutoRotating);
        });

        // 重置视角
        btnReset.addEventListener('click', () => {
            viewer.cameraTarget = '0m 0.5m 0m';
            viewer.cameraOrbit = '0deg 75deg 3m';
            viewer.fieldOfView = '45deg';
        });

        // 线框模式（通过切换 exposure 模拟）
        btnWireframe.addEventListener('click', () => {
            isWireframe = !isWireframe;
            viewer.exposure = isWireframe ? '0.5' : '1.2';
            btnWireframe.classList.toggle('active', isWireframe);
        });

        // 5秒后如果还在加载，显示提示
        setTimeout(() => {
            if (!loadingOverlay.classList.contains('hidden')) {
                document.querySelector('.loading-text').textContent = '模型较大，请耐心等待...';
            }
        }, 5000);
    </script>
</body>
</html>
